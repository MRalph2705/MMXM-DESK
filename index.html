<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style><title>MMXM Trader's Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B0F17"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>window.PWA_STANDALONE=true</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: app shell — left rail (desktop) / bottom tabs (phone), one reading column, chart panels as the hero objects */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --surface2: #E9EDF3; --line: #D3D9E3;
  --fg: #121826; --muted: #586377; --gold: #A8730C; --gold-soft: #F6E7C6;
  --bull: #0F8E6C; --bear: #C3363E; --blue: #2C66D6; --chart: #0E121C; --chart-fg: #E8ECF4; --chart-muted:#8C97AB;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B0F17; --surface: #131927; --surface2: #1A2233; --line: #273146;
  --fg: #E6EAF2; --muted: #8B96AA; --gold: #F0B952; --gold-soft: #3A2E15;
  --bull: #3FC4A0; --bear: #EE6168; --blue: #6C9FFA; --chart: #0E121C; --chart-fg: #E8ECF4; --chart-muted:#8C97AB; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0B0F17; --surface: #131927; --surface2: #1A2233; --line: #273146;
  --fg: #E6EAF2; --muted: #8B96AA; --gold: #F0B952; --gold-soft: #3A2E15;
  --bull: #3FC4A0; --bear: #EE6168; --blue: #6C9FFA; --chart: #0E121C; --chart-fg: #E8ECF4; --chart-muted:#8C97AB; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--body); margin: 0; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--display); font-stretch: 88%; letter-spacing: -0.01em; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 800; }
h2 { font-size: 22px; font-weight: 750; }
h3 { font-size: 16px; font-weight: 700; font-stretch: 95%; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.muted { color: var(--muted); }

/* shell */
.shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 6px; padding: 20px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 18px; }
.brand svg { flex: none; }
.brand b { font: 850 17px/1.05 var(--display); font-stretch: 80%; letter-spacing: .01em; text-transform: uppercase; }
.brand small { display: block; font: 500 11px/1.3 var(--mono); color: var(--muted); letter-spacing: .04em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--surface2); color: var(--fg); box-shadow: inset 3px 0 0 var(--gold); }
.nav svg { width: 18px; height: 18px; flex: none; }
.clock { margin-top: auto; border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; }
.clock .t { font: 500 22px/1 var(--mono); font-variant-numeric: tabular-nums; }
.kz { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); width: fit-content; }
.kz.on { background: var(--gold-soft); color: var(--gold); }
.kz i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.themebtn { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); }

main { min-width: 0; padding-block: 28px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 920px; margin: 0 auto; display: grid; gap: 28px; }
.topclock { display: none; }

/* cards & lists */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.mod { display: grid; gap: 12px; }
.mod-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.lessons { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.lrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 16px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.lrow:first-child { border-top: 0; }
.lrow:hover { background: var(--surface2); }
.lrow .n { font: 500 13px var(--mono); color: var(--muted); }
.lrow .tt { font-weight: 600; }
.lrow .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.done-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.done-dot.on { background: var(--bull); border-color: var(--bull); }
.done-dot.on::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.bridge { font: 600 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--blue); border: 1px solid currentColor; border-radius: 4px; padding: 3px 5px; margin-left: 6px; vertical-align: 2px; }
.progress { height: 6px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--gold); }
.hero { display: grid; gap: 14px; }
.hero p { max-width: 62ch; color: var(--muted); font-size: 16px; }
.path { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.path a { text-decoration: none; color: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface); display: grid; gap: 4px; }
.path a b { font: 700 13px/1.2 var(--display); font-stretch: 92%; }
.path a span { font: 500 11px var(--mono); color: var(--muted); }
.path a:hover { border-color: var(--gold); }

/* lesson */
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.lead { font-size: 18px; line-height: 1.5; max-width: 62ch; }
.src { font: 500 12px/1.4 var(--mono); color: var(--muted); }
.chartbox { background: var(--chart); border-radius: var(--r); padding: 10px 10px 6px; color: var(--chart-fg); overflow-x: auto; }
.chartbox svg { display: block; width: 100%; min-width: 560px; height: auto; }
.chartbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 6px 8px; flex-wrap: wrap; }
.chartbar b { font: 700 14px var(--display); font-stretch: 92%; color: var(--chart-fg); }
.chartbar button { background: #1E2738; border: 1px solid #2F3A52; color: var(--chart-fg); border-radius: 6px; padding: 4px 10px; font-size: 12px; }
.sec { display: grid; gap: 10px; }
.defs { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); border-top: 1px solid var(--line); }
.defs dt, .defs dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); }
.defs dt { font-weight: 600; padding-right: 16px; }
.rules { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.rules li { padding-left: 22px; position: relative; max-width: 70ch; }
.rules li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 8px; height: 8px; border: 2px solid var(--gold); transform: rotate(45deg); }
.proc { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: 0; border-left: 2px solid var(--line); margin-left: 12px; }
.proc li { counter-increment: s; position: relative; padding: 6px 0 12px 26px; max-width: 70ch; }
.proc li::before { content: counter(s); position: absolute; left: -13px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 2px solid var(--gold); font: 600 11px/20px var(--mono); text-align: center; color: var(--gold); }
.warn { border: 1px solid var(--bear); border-left-width: 4px; border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
.warn b { color: var(--bear); font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.check { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; text-decoration: none; color: inherit; }
.btn:hover { border-color: var(--fg); }
.btn.pri { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.gold { background: var(--gold); color: #1A1204; border-color: var(--gold); }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.danger { color: var(--bear); border-color: var(--bear); }
.navpair { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
video { width: 100%; border-radius: var(--r); background: #000; display: block; aspect-ratio: 16/9; max-width: 100%; }

/* playbook */
.phase { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); }
.phase .when { font: 600 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.phase .body { display: grid; gap: 8px; min-width: 0; }
.tick { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.tick input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--gold); flex: none; }
.tick input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.out { font: 500 12px/1.4 var(--mono); color: var(--gold); }
.times { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tz { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--surface); display: grid; gap: 2px; }
.tz b { font: 700 14px var(--display); font-stretch: 92%; }
.tz .mono { font-size: 13px; }
.calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
.inp { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 10px; min-width: 0; }
textarea.inp { min-height: 84px; resize: vertical; }
.result { display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline; padding: 14px; border-radius: 8px; background: var(--surface2); }
.result .big { font: 600 28px/1 var(--mono); font-variant-numeric: tabular-nums; }

/* videos */
.vgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.vcard { display: grid; gap: 8px; }
.vcard .meta { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.vcard a { font-size: 13px; color: var(--muted); }
.vmissing { aspect-ratio: 16/9; border-radius: var(--r); background: var(--chart); color: var(--chart-muted); display: grid; place-items: center; font-size: 13px; padding: 16px; text-align: center; }

/* journal */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.stat { padding: 14px 16px; border-left: 1px solid var(--line); display: grid; gap: 2px; }
.stat:first-child { border-left: 0; }
.stat b { font: 600 24px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.eq { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.eq svg { width: 100%; height: 140px; display: block; }
.jlist { display: grid; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.jrow { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.jrow:first-child { border-top: 0; }
.jrow:hover { background: var(--surface2); }
.pill { font: 600 11px/1 var(--mono); padding: 5px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.pill.win { background: color-mix(in srgb, var(--bull) 18%, transparent); color: var(--bull); }
.pill.loss { background: color-mix(in srgb, var(--bear) 18%, transparent); color: var(--bear); }
.pill.gold { background: var(--gold-soft); color: var(--gold); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding: 10px 0; z-index: 5; }
.steps button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.steps button[aria-current="step"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.steps button .c { font-family: var(--mono); font-size: 11px; margin-left: 4px; opacity: .7; }
.field { display: grid; gap: 8px; padding: 16px 0; border-top: 1px solid var(--line); }
.field:first-of-type { border-top: 0; }
.field .lab { font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.field .lab .ok { color: var(--bull); font-size: 13px; }
.hint { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 2px 8px; font-size: 13px; color: var(--muted); }
.hint b { font: 600 10px/1.9 var(--mono); letter-spacing: .1em; color: var(--gold); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--fg); font-weight: 600; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.drop.over { border-color: var(--gold); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { position: relative; width: 150px; max-width: 100%; aspect-ratio: 16/10; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--surface2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.65); color: #fff; border: 0; border-radius: 4px; font-size: 12px; padding: 2px 6px; }
.formnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; position: sticky; bottom: 0; padding: 12px 0; background: var(--bg); border-top: 1px solid var(--line); }
.calcR { font: 500 13px var(--mono); color: var(--muted); }
.viewimgs { display: grid; gap: 10px; }
.viewimgs img { border-radius: 8px; border: 1px solid var(--line); width: 100%; }
.kv { display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr); border-top: 1px solid var(--line); }
.kv div { padding: 8px 0; border-bottom: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.kv div:nth-child(odd) { color: var(--muted); font-size: 13px; padding-right: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 50; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--bear); border-radius: 8px; }
.search { max-width: 360px; }
.gl { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0, 1fr); border-top: 1px solid var(--line); }
.gl dt, .gl dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); }
.gl dt { font: 600 14px var(--mono); }
.empty { display: grid; gap: 14px; padding: 22px; border: 1px dashed var(--line); border-radius: var(--r); }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.three div { border-radius: 8px; background: var(--surface2); padding: 12px; display: grid; gap: 4px; font-size: 13px; }
.three b { font: 700 14px var(--display); font-stretch: 92%; }
.status { font: 500 12px var(--mono); color: var(--muted); }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 20; flex-direction: row; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); border-right: 0; border-top: 1px solid var(--line); }
  .brand, .rail .clock, .rail .themebtn { display: none; }
  .nav { flex-direction: row; width: 100%; justify-content: space-around; }
  .nav a { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 4px; flex: 1; text-align: center; }
  .nav a[aria-current="page"] { box-shadow: inset 0 3px 0 var(--gold); }
  main { padding-block: 0 110px; }
  .topclock { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 18px calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); justify-content: space-between; align-items: center; gap: 10px; }
  .topclock b { font: 850 15px/1 var(--display); font-stretch: 80%; text-transform: uppercase; }
  .topclock .t { font: 500 13px var(--mono); }
  .path { display: none; }
  .vgrid, .times, .three { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; } .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .phase { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .defs, .gl, .kv { grid-template-columns: minmax(0, 1fr); }
  .defs dt, .gl dt { border-bottom: 0; padding-bottom: 0; }
  .kv div:nth-child(odd) { border-bottom: 0; padding-bottom: 0; }
  .jrow { grid-template-columns: minmax(0, 1fr) auto; }
  .jrow .d { grid-column: 1 / -1; }
  .formnav { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  <aside class="rail">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="9" width="5" height="12" rx="1" fill="var(--bear)"/><line x1="5.5" y1="5" x2="5.5" y2="25" stroke="var(--bear)" stroke-width="1.6"/><rect x="12.5" y="12" width="5" height="10" rx="1" fill="var(--bull)"/><line x1="15" y1="8" x2="15" y2="26" stroke="var(--bull)" stroke-width="1.6"/><rect x="22" y="4" width="5" height="12" rx="1" fill="var(--bull)"/><line x1="24.5" y1="2" x2="24.5" y2="19" stroke="var(--bull)" stroke-width="1.6"/><line x1="1" y1="17" x2="29" y2="17" stroke="var(--gold)" stroke-width="1.4" stroke-dasharray="2.5 2"/></svg>
      <div><b>MMXM Desk</b><small>course · playbook · journal</small></div>
    </div>
    <nav class="nav" id="nav"></nav>

/* ---------------- diagram SVG ---------------- */
const COLV = { gold: "#F0B952", bull: "#3FC4A0", bear: "#EE6168", blue: "#6C9FFA", dim: "#8C97AB", fg: "#E8ECF4", purp: "#B284FA" };
function diagramSVG(key, id) {
  const sp = DIAGRAMS[key]; if (!sp) return "";
  const W = 960, H = 440, x0 = 30, x1 = 940, y0 = 40, y1 = 410;
  const c = sp.c; let lo = Math.min(...c.map(k => k[2])), hi = Math.max(...c.map(k => k[1]));
  sp.a.forEach(a => { if (a[0] === "t") { lo = Math.min(lo, a[2] - 2); hi = Math.max(hi, a[2] + 2); } });
  const r = hi - lo; lo -= r * 0.04; hi += r * 0.06;
  const step = (x1 - x0) / c.length, X = i => x0 + step * (i + .5), Y = p => y1 - (p - lo) / (hi - lo) * (y1 - y0);
  const w = Math.max(3, step * .62);
  let g = "", ann = [];
  const at = v => `data-at="${v}"`;
  sp.a.filter(a => a[0] === "v").forEach(a => { const x = x0 + step * a[1]; g += `<g class="an" ${at(0)}><line x1="${x}" x2="${x}" y1="${y0}" y2="${y1}" stroke="${COLV[a[2]]}" stroke-opacity=".55" stroke-dasharray="4 6"/><text x="${x + 5}" y="${y0 - 6}" fill="${COLV[a[2]]}" font-size="13" font-family="IBM Plex Mono, monospace">${esc(a[3])}</text></g>`; });
  sp.a.filter(a => a[0] === "z").forEach(a => { const [, l, h, i0, i1, col, lab, t] = a; const xa = x0 + step * i0, xb = Math.min(x1, x0 + step * (i1 + 1)); g += `<g class="an" ${at(t)}><rect x="${xa}" y="${Y(h)}" width="${xb - xa}" height="${Math.max(2, Y(l) - Y(h))}" fill="${COLV[col]}" fill-opacity=".18" stroke="${COLV[col]}" stroke-opacity=".75"/></g>`; ann.push([t, `<text x="${xa + 4}" y="${Y(h) - 6}" fill="${COLV[col]}" font-size="13" font-weight="600">${esc(lab)}</text>`]); });
  c.forEach((k, i) => { const [o, h, l, cl] = k; const col = cl >= o ? COLV.bull : COLV.bear; const yt = Math.min(Y(o), Y(cl)), yb = Math.max(Y(o), Y(cl)); g += `<g class="cd" data-i="${i}"><line x1="${X(i)}" x2="${X(i)}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}" stroke-width="1.6"/><rect x="${X(i) - w / 2}" y="${yt}" width="${w}" height="${Math.max(1.5, yb - yt)}" fill="${col}"/></g>`; });
  sp.a.forEach(a => {
    const k = a[0];
    if (k === "h") { const [, p, i0, i1, col, lab, dash, t] = a; const xa = x0 + step * (i0 + .5), xb = Math.min(x1, x0 + step * (i1 + .5)); ann.push([t, `<line x1="${xa}" x2="${xb}" y1="${Y(p)}" y2="${Y(p)}" stroke="${COLV[col]}" stroke-width="1.6" ${dash ? 'stroke-dasharray="6 6"' : ""}/>` + (lab ? `<text x="${xb - 2}" y="${Y(p) - 6}" text-anchor="end" fill="${COLV[col]}" font-size="12.5">${esc(lab)}</text>` : "")]); }
    else if (k === "t") { const [, i, p, s, col, t] = a; ann.push([t, `<text x="${X(i)}" y="${Y(p)}" text-anchor="middle" dominant-baseline="middle" fill="${COLV[col]}" font-size="14" font-weight="600" paint-order="stroke" stroke="#0E121C" stroke-width="5" stroke-linejoin="round">${esc(s)}</text>`]); }
    else if (k === "a") { const [, i0, p0, i1, p1, col, t] = a; ann.push([t, `<line x1="${X(i0)}" y1="${Y(p0)}" x2="${X(i1)}" y2="${Y(p1)}" stroke="${COLV[col]}" stroke-width="2.4" marker-end="url(#ar-${id}-${col})"/>`]); }
    else if (k === "d") { const [, i, p, col, t] = a; ann.push([t, `<circle cx="${X(i)}" cy="${Y(p)}" r="4.5" fill="${COLV[col]}"/>`]); }
  });
  ann.sort((a, b) => a[0] - b[0]);
  const marks = Object.entries(COLV).map(([n, v]) => `<marker id="ar-${id}-${n}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${v}"/></marker>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sp.title)}" font-family="IBM Plex Sans, system-ui, sans-serif"><defs>${marks}</defs>${g}${ann.map(([t, s]) => `<g class="an" data-at="${t}">${s}</g>`).join("")}<text x="${x1}" y="${H - 6}" text-anchor="end" fill="#8C97AB" font-size="12" font-family="IBM Plex Mono, monospace">${esc(sp.tf)}</text></svg>`;
}
function chartPanel(key, id) {

function playDiagram(id) {

  const cds = [...fig.querySelectorAll(".cd")], ans = [...fig.querySelectorAll(".an")];

function riskRule(phase, opt, pl) {
  if (phase === "live") {
    if (pl >= 2) return { r: 0, rr: "—", msg: "You are at +2% or more. Stop. Take the payout. Move to the next account." };
    if (pl >= 1) return { r: 1, rr: "1:2 or 1:3", msg: "You have a buffer. Risk 1%." };
    return { r: 0.5, rr: "1:2", msg: pl < 0 ? "Below break-even. Risk 0.5% or less. Never more." : "Start: risk 0.5% for a 1% buffer." };
  }
  const target = phase === "p1" ? 8 : 5;
  if (pl >= target) return { r: 0, rr: "—", msg: "Target reached. Stop trading this phase." };
  if (pl < 0) return { r: 1, rr: opt === "A" ? "1:2" : "1:3", msg: "Below break-even. Risk 1% or less. Never more." };
  const buf = opt === "A" ? 2 : 3;
  if (pl >= buf - 0.05) {
    if (phase === "p1") return { r: 2, rr: opt === "A" ? "1:3" : "1:2.5", msg: `Buffer built. Trade 2: risk 2% → +${opt === "A" ? 6 : 5}%.` };
    return { r: 1, rr: opt === "A" ? "1:3" : "1:2", msg: `Buffer built. Trade 2: risk 1% → +${opt === "A" ? 3 : 2}%.` };
  }
  return { r: 1, rr: opt === "A" ? "1:2" : "1:3", msg: `Trade 1: risk 1% to build a ${buf}% buffer.` };
}

    LS.set("risk", v);
    const r = riskRule(v.phase, v.opt, v.pl); const amt = v.bal * r.r / 100; const lots = v.stop > 0 && v.pip > 0 ? amt / (v.stop * v.pip) : 0;
    $("#rOut").innerHTML = `<div><div class="muted" style="font-size:12px">Risk</div><div class="big">${r.r}%</div></div><div><div class="muted" style="font-size:12px">Amount</div><div class="big">${amt.toLocaleString(undefined, { maximumFractionDigits: 0 })}</div></div><div><div class="muted" style="font-size:12px">Target R:R</div><div class="big">${r.rr}</div></div><div><div class="muted" style="font-size:12px">Position size</div><div class="big">${lots ? lots.toFixed(2) : "—"} <span style="font-size:14px">lots</span></div></div><p style="flex-basis:100%;font-weight:600">${esc(r.msg)}</p>`;
  };

}

function idbOpen() { return new Promise((res, rej) => { try { const r = indexedDB.open("mmxm-journal", 1); r.onupgradeneeded = () => { r.result.createObjectStore("entries", { keyPath: "id" }); r.result.createObjectStore("imgs"); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }

Store.ready = (async () => {
  try {
    if (window.claude && claude.use) {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (db && user) {
        Store.uid = await user.id();
        if (Store.uid) {
          Store.db = db; Store.mode = "cloud";
          claude.use("assets").then(a => Store.assets = a).catch(() => {});
          claude.use("downloads").then(d => Store.dl = d).catch(() => {});
          await new Promise(res => {
            const tm = setTimeout(res, 10000);
            db.collection("data/users/" + Store.uid).onSnapshot(snap => {
              clearTimeout(tm);
              Store.entries = snap.docs.filter(d => d.id.startsWith("t_")).map(d => ({ ...d.data(), id: d.id }));
              res(); if ((location.hash || "") === "#journal" && !Store.editing) renderJournal();

})();
async function saveEntry(e) {

}
async function deleteEntry(id) {
  const e = Store.entries.find(x => x.id === id);
  if (Store.mode === "cloud") { await Store.db.doc(`data/users/${Store.uid}/${id}`).delete(); if (Store.assets && e) for (const im of imgsOf(e)) if (im.asset) Store.assets.delete(im.asset).catch(() => {}); }
  else { await idbDo("entries", "readwrite", s => s.delete(id)); if (e) for (const im of imgsOf(e)) if (im.lid) await idbDo("imgs", "readwrite", s => s.delete(im.lid)); }

}
const imgsOf = e => ["htfImg", "m15Img", "exImg"].flatMap(k => e[k] || []);
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, 1800 / Math.max(img.width, img.height)); const cv = document.createElement("canvas");
    cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise(res => cv.toBlob(res, "image/jpeg", 0.86));
  } finally { URL.revokeObjectURL(url); }
}
async function storeImage(file) {
  const blob = await shrink(file);
  if (Store.mode === "cloud" && Store.assets) { const r = await Store.assets.upload(blob); return { asset: r.id, url: r.url }; }
  const lid = "i_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  if (Store.mode === "local") { await idbDo("imgs", "readwrite", s => s.put(blob, lid)); }
  else { Store.mem = Store.mem || {}; Store.mem[lid] = blob; }
  return { lid };
}
const urlCache = {};
async function imgURL(im) {
  if (im.url) return im.url; if (im.data) return im.data;
  if (urlCache[im.lid]) return urlCache[im.lid];
  const b = Store.mode === "local" ? await idbDo("imgs", "readonly", s => s.get(im.lid)) : (Store.mem || {})[im.lid];
  return b ? (urlCache[im.lid] = URL.createObjectURL(b)) : "";
}

function rOf(e) { const v = parseFloat(e.rr); if (!isNaN(v)) return v; if (e.result === "Loss") return -1; if (e.result === "Break-even") return 0; return null; }

function equityHTML(tr) {

    for (const e of list) {
      if (!e.id || !String(e.id).startsWith("t_")) continue;
      for (const k of ["htfImg", "m15Img", "exImg"]) if (e[k]) e[k] = await Promise.all(e[k].map(async im => { if (im.data) { try { const b = await (await fetch(im.data)).blob(); return await storeImage(new File([b], "img.jpg", { type: b.type || "image/jpeg" })); } catch { return im; } } return im; }));
      await saveEntry(e); n++;
    }
    toast(`Imported ${n} entries`); renderJournal();
  } catch { toast("That file is not a journal export."); }
}

/* ---------------- boot ---------------- */
if ("serviceWorker" in navigator && window.PWA_STANDALONE) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
route();
})();

</script>
</body></html>
